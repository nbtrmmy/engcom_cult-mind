<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cult Mind</title>
<style>
/* Layout: a single composed picture on a full-bleed canvas, no text. A small pale ghost stands in the middle; tall identical ghosts hold hands in arcs around it and all stare at it. Only breathing, swaying and drifting dust move. */
:root {
  --ink: #090615;
  --lav: #cfcaf5;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--lav);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
</style>

<canvas id="cv" role="img" aria-label="A small hot-pink ghost with a panicked, queasy face stands alone in the middle. Tall identical ghosts hold hands in arcs around it, every one glaring at it with wide, bulging eyes."></canvas>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const amp = reduce ? 0.35 : 1;
  const SQ = 0.42;
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ss = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let W, H, DPR, M, CX, CY, Rr, cs, ms, mainX, mainY;
  let ghosts = [], rings = [], motes = [];

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    M = Math.min(W, H);
    CX = W / 2; CY = H * 0.5;
    Rr = 0.28 * Math.min(W, H * 1.35);
    cs = M * 0.085;
    ms = cs * 2.2;
    mainX = CX; mainY = CY + Rr * SQ * 0.5;

    const depth = (y) => 0.72 + 0.6 * clamp((y - (CY - 1.7 * Rr * SQ)) / (3.4 * Rr * SQ), 0, 1);
    const specs = [
      { n: 9, step: 0.5, R: Rr, size: 2.7, dim: 0 },
      { n: 15, step: 0.26, R: Math.min(Rr * 1.62, W / 2 - cs * 1.9), size: 2.5, dim: 7 }
    ];
    ghosts = []; rings = [];
    specs.forEach((sp, ri) => {
      const arc = [];
      for (let k = 0; k < sp.n; k++) {
        const th = -Math.PI / 2 + (k - (sp.n - 1) / 2) * sp.step;
        const x = CX + Math.cos(th) * sp.R, y = CY + Math.sin(th) * sp.R * SQ;
        const sc = depth(y);
        const g = { x, y, s: cs * sp.size * sc, sc, dim: sp.dim, ring: ri };
        arc.push(g); ghosts.push(g);
      }
      rings.push(arc);
    });
    ghosts.sort((a, b) => a.y - b.y);

    const rand = mulberry32(11);
    motes = [];
    for (let i = 0; i < 70; i++) motes.push({ x: rand() * W, y: rand() * H, s: 0.6 + rand() * 1.6, v: 3 + rand() * 7, ph: rand() * TAU });
  }
  layout();
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });

  /* ---------- one ghost ---------- */
  // x,y = centre of the dome. s = full height.
  function ghostPath(x, y, s, hem) {
    const w = s * 0.34, hh = s * 0.66;
    ctx.beginPath();
    ctx.moveTo(x - w, y);
    ctx.arc(x, y, w, Math.PI, TAU);
    ctx.lineTo(x + w, y + hh);
    const n = 4, sw = (2 * w) / n;
    for (let i = 0; i < n; i++) {
      const x1 = x + w - (i + 1) * sw, cx = x + w - (i + 0.5) * sw;
      ctx.quadraticCurveTo(cx, y + hh + s * (0.085 + 0.03 * Math.sin(hem + i * 1.3) * amp), x1, y + hh);
    }
    ctx.closePath();
  }
  function ghost(x, y, s, o) {
    const w = s * 0.34, hh = s * 0.66;
    ctx.save();
    ctx.globalAlpha = o.alpha;
    ctx.translate(x, y + hh); ctx.rotate(o.lean || 0); ctx.translate(-x, -(y + hh));
    const g = ctx.createLinearGradient(0, y - w, 0, y + hh + s * 0.1);
    g.addColorStop(0, o.top); g.addColorStop(1, o.bot);
    ctx.fillStyle = g;
    ghostPath(x, y, s, o.hem);
    ctx.fill();
    if (o.hands) {
      ctx.fillStyle = o.hands;
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(x + sx * w * 1.02, y + hh * 0.55, w * 0.17, 0, TAU); ctx.fill(); }
    }
    const ey = y + w * 0.05 + o.eo[1], op = Math.max(0.04, o.open);
    for (const sx of [-1, 1]) {
      if (o.omg) {
        // panicked eyes, a little sick: round and wide, tiny jittering pupils, faint dark bags, worried brows
        const bx = x + sx * w * 0.4, by = y, rx = w * 0.27, ry = w * 0.32 * op;
        ctx.fillStyle = 'rgba(150,25,110,0.4)';
        ctx.beginPath(); ctx.ellipse(bx, by + ry * 0.95, rx * 1.1, w * 0.1, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fbf7ff';
        ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(10,5,30,0.6)'; ctx.lineWidth = Math.max(1, w * 0.04); ctx.stroke();
        ctx.fillStyle = '#04020a';
        ctx.beginPath(); ctx.arc(bx + o.jx, by + o.jy, w * 0.07, 0, TAU); ctx.fill();
        const inX = bx - sx * rx, outX = bx + sx * rx;
        ctx.strokeStyle = 'rgba(10,5,30,0.7)'; ctx.lineWidth = Math.max(1.5, w * 0.06); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(outX, by - ry * 1.25);
        ctx.quadraticCurveTo((inX + outX) / 2, by - ry * 1.95, inX, by - ry * 1.85);
        ctx.stroke();
        continue;
      }
      if (o.bulge) {
        const bx = x + sx * w * 0.42, by = y + w * 0.02, rx = w * 0.3, ry = w * 0.36 * op;
        ctx.fillStyle = '#ecebff';
        ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(10,5,30,0.55)'; ctx.lineWidth = Math.max(1, w * 0.035);
        ctx.stroke();
        ctx.fillStyle = '#04020a';
        ctx.beginPath(); ctx.arc(bx + o.eo[0] * 1.4, by + o.eo[1] * 1.2 * op, w * 0.085, 0, TAU); ctx.fill();
        continue;
      }
      const ex = x + sx * w * 0.4 + o.eo[0];
      ctx.fillStyle = 'rgba(25,12,70,0.32)';
      ctx.beginPath(); ctx.ellipse(ex, ey + w * 0.32, w * 0.26, w * 0.09, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#04020a';
      ctx.beginPath(); ctx.ellipse(ex, ey, w * 0.21, w * 0.25 * op, 0, 0, TAU); ctx.fill();
    }
    if (o.omg) {
      // open mouth, slightly wobbly, like it might be sick any second
      const mw = w * 0.22 + Math.sin(o.t * 9) * w * 0.015 * amp, mh = w * 0.28 + Math.sin(o.t * 6 + 1) * w * 0.025 * amp;
      ctx.fillStyle = '#04020a';
      ctx.beginPath(); ctx.ellipse(x + w * 0.02, y + w * 0.72, mw, mh, 0.08, 0, TAU); ctx.fill();
      for (const k of [0, 1]) {
        const sd = (o.t * 0.6 + k * 0.5) % 1;
        const sx2 = x + (k ? -1 : 1) * w * 0.78, sy2 = y - w * 0.55 + sd * w * 0.9;
        ctx.fillStyle = `rgba(170,215,255,${0.85 * (1 - sd * 0.6)})`;
        ctx.beginPath(); ctx.moveTo(sx2, sy2 - w * 0.16);
        ctx.quadraticCurveTo(sx2 + w * 0.11, sy2 + w * 0.02, sx2, sy2 + w * 0.1);
        ctx.quadraticCurveTo(sx2 - w * 0.11, sy2 + w * 0.02, sx2, sy2 - w * 0.16);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    ctx.strokeStyle = 'rgba(10,5,30,0.55)';
    ctx.lineWidth = Math.max(1, w * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath();
    const my = y + w * 0.64;
    ctx.moveTo(x - w * 0.14 + o.eo[0] * 0.5, my);
    ctx.quadraticCurveTo(x + o.eo[0] * 0.5, my + w * 0.07, x + w * 0.14 + o.eo[0] * 0.5, my);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- draw loop ---------- */
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    const fadeIn = ss(t / 1.5);
    const ph = (t % 0.9) / 0.9, pulse = Math.exp(-ph * 8);
    const p = 0.62 + 0.08 * pulse;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b0818'); bg.addColorStop(0.55, '#150f33'); bg.addColorStop(1, '#060410');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const mg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Rr * 1.9);
    mg.addColorStop(0, 'rgba(120,105,230,0.2)'); mg.addColorStop(1, 'rgba(120,105,230,0)');
    ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);

    for (const m of motes) {
      const y = ((m.y - t * m.v) % H + H) % H;
      const x = m.x + Math.sin(t * 0.3 + m.ph) * 8;
      ctx.fillStyle = `rgba(170,160,255,${0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 0.8 + m.ph))})`;
      ctx.beginPath(); ctx.arc(x, y, m.s, 0, TAU); ctx.fill();
    }

    // everyone moves exactly together
    const bobS = Math.sin(t * 1.0), swayS = Math.sin(t * 0.5), hemS = t * 2.0;
    const bc = t % 5.5, blink = bc < 0.2 ? 1 - Math.sin(Math.PI * (bc / 0.2)) : 1;
    const lean0 = 0.1 + 0.02 * Math.sin(t * 0.7);
    for (const g of ghosts) {
      g.px = g.x + swayS * g.s * 0.03 * amp;
      g.py = g.y + bobS * g.s * 0.035 * amp;
    }

    // linked hands, behind the bodies
    ctx.lineCap = 'round';
    const tw = Math.max(1.5, cs * 0.085);
    ctx.strokeStyle = 'rgba(205,195,255,0.8)';
    ctx.lineWidth = tw;
    for (const arc of rings) {
      for (let k = 0; k < arc.length - 1; k++) {
        const a = arc[k], b = arc[k + 1];
        const ax = a.px, ay = a.py + a.s * 0.66 * 0.55, bx = b.px, by = b.py + b.s * 0.66 * 0.55;
        ctx.beginPath(); ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 + cs * 0.12, bx, by);
        ctx.stroke();
      }
    }

    // the staring crowd
    for (const g of ghosts) {
      const dx = mainX - g.px, dy = mainY - g.py, dd = Math.hypot(dx, dy) + 1;
      const L = 24 + ((g.sc - 0.72) / 0.6) * 22 - g.dim;
      ghost(g.px, g.py, g.s, {
        alpha: fadeIn * (g.ring ? 0.9 : 0.97), bulge: true,
        lean: lean0 * clamp(dx / Rr, -1, 1), hem: hemS, open: blink,
        eo: [(dx / dd) * g.s * 0.34 * 0.13, (dy / dd) * g.s * 0.34 * 0.13],
        top: `hsl(252,28%,${L + 10}%)`, bot: `hsl(256,34%,${Math.max(8, L - 8)}%)`,
        hands: `hsl(254,34%,${L + 14}%)`
      });
    }

    // the small one: shivers, one beat behind the crowd
    const shiver = Math.sin(t * 23) * ms * 0.012 * amp;
    const mt = t - 0.8;
    const mbc = mt % 5.5, mblink = mbc < 0.2 ? 1 - Math.sin(Math.PI * (mbc / 0.2)) : 1;
    ghost(mainX + shiver, mainY + Math.sin(mt * 1.0) * ms * 0.035 * amp, ms, {
      alpha: fadeIn, lean: Math.sin(t * 1.6) * 0.05 * amp, hem: mt * 3.0, open: 1, eo: [0, 0], omg: true, t,
      jx: Math.sin(t * 5.3) * ms * 0.34 * 0.06 * amp, jy: Math.cos(t * 4.1) * ms * 0.34 * 0.045 * amp,
      top: 'hsl(332,100%,72%)', bot: 'hsl(326,92%,56%)', hands: 'hsl(329,95%,64%)'
    });

    // tunnel vision around the small one
    const maxD = Math.max(W, H);
    const inner = maxD * (0.6 - 0.38 * p), outer = inner + maxD * 0.45;
    const vg = ctx.createRadialGradient(mainX, mainY, inner, mainX, mainY, outer);
    vg.addColorStop(0, 'rgba(4,2,12,0)');
    vg.addColorStop(1, `rgba(4,2,12,${0.4 + 0.52 * p})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,40,30,${0.04 * pulse})`; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
